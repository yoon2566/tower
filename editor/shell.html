<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IsoDefense AI</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Malgun Gothic',sans-serif;background:#fff;color:#e2e8f0}button,textarea{font:inherit}button{cursor:pointer;border:1px solid #475569;border-radius:9px;background:#0f172a;color:#fff;padding:9px 13px}button:hover{background:#334155}button:disabled{opacity:.5;cursor:wait}#actions{position:fixed;top:112px;left:16px;z-index:10;display:flex;gap:6px}#game{position:fixed;inset:0;width:100%;height:100dvh;border:0}#panel{position:fixed;inset:0 auto 0 0;width:350px;background:#0f172a;z-index:20;display:none;flex-direction:column;border-right:1px solid #475569;box-shadow:8px 0 30px #0003}body.editing #panel{display:flex}body.editing #actions{left:366px}body.editing #game{left:350px;width:calc(100% - 350px)}header{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid #334155}h1{font-size:17px;margin:0}#chat{flex:1;overflow:auto;padding:16px;white-space:pre-wrap;font-size:14px;line-height:1.6}.message{padding:10px 12px;border-radius:10px;background:#1e293b;margin-bottom:12px;overflow-wrap:anywhere}.user{background:#312e81}#tools{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}#tools button{font-size:12px;padding:7px}form{border-top:1px solid #334155;padding:12px}textarea{width:100%;resize:vertical;min-height:90px;max-height:180px;border:1px solid #475569;border-radius:8px;padding:10px;background:#020617;color:#fff}form button{width:100%;background:#4f46e5;margin-top:8px}#status{font-size:12px;color:#cbd5e1;min-height:32px;padding:8px 12px}#toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:#0f172a;color:white;padding:10px;border-radius:8px;z-index:30;display:none;max-width:90vw}#candidate{position:fixed;left:-10000px;top:0;width:1000px;height:750px;border:0} @media(max-width:700px){#actions{top:112px;left:8px}body.editing #actions{left:8px}#actions button{font-size:12px;padding:8px}#panel{width:min(350px,90vw)}body.editing #game{left:0;width:100%}}
</style></head><body><iframe id="game" title="타워디펜스 게임" sandbox="allow-scripts"></iframe><div id="actions"><button id="edit">✦ AI 수정</button><button id="download">↓ HTML 다운로드</button></div><aside id="panel"><header><h1>✦ AI로 게임 수정</h1><button id="close" aria-label="수정창 닫기">✕</button></header><div id="chat" aria-live="polite"><div class="message">어떻게 바꿔볼까요?
예: 시작 자금을 2,000으로 바꿔줘.

수정하면 게임이 처음부터 시작됩니다.</div></div><div id="status" role="status">접속하면 원본으로 시작합니다. 수정본은 HTML로 보관하세요.</div><div id="tools"><button id="undo" disabled>이전 버전</button><button id="import">HTML 불러오기</button><button id="reset">원본 복원</button></div><form id="form"><textarea id="prompt" aria-label="게임 수정 요청" placeholder="원하는 변경을 입력하세요" maxlength="10000" required></textarea><button id="send" type="submit">수정하기</button></form></aside><input id="file" type="file" accept=".html" hidden><div id="toast" role="status"></div><script>/*EDITOR_CODE*/</script></body></html>
